<div class="NewHeader">
  <h1 mat-dialog-title>{{ isEditMode ? 'Update Item' : 'Add Item' }}</h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px">
    <form [formGroup]="myGroup" (ngSubmit)="upsertItem()">
      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label item-field-label"
            >Item Name :</label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Item Name"
            formControlName="ItemName"
            type="text"
          />
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label item-field-label"
            >Item Code :</label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Item Code"
            formControlName="ItemCode"
            type="text"
          />
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label item-field-label"
            >Category :</label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Category Name"
            formControlName="Category"
            type="text"
          />
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label item-field-label"
            >Sub-Category </label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Sub-Category Name"
            formControlName="SubCategory"
            type="text"
          />
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label item-field-label"
            >Quantity :</label
          >
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" formControlName="Quantity" type="number" min="0" />
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label item-field-label"
            >Unit Rate :</label
          >
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" formControlName="UnitRate" type="number" min="0" />
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label item-field-label"
            >Description :</label
          >
        </div>
        <div class="col-sm-9">
          <textarea
            class="form-control name back"
            rows="3"
            placeholder="Enter Description"
            formControlName="Description"
          ></textarea>
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
