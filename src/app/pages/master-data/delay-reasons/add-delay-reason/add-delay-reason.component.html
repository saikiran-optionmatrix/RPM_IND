<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Delay Reason' : 'Add Delay Reason' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="myGroup" (ngSubmit)="upsertDelayReason()">

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Delay Reason :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="100" placeholder="Enter Delay Reason"
            formControlName="reason" type="text">
          @if (isSubmitting && f['reason'].errors?.['required']) {
            <span class="text-danger" style="font-size: 12px;">Delay reason is required</span>
          }
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Context :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="100" placeholder="Enter Context"
            formControlName="context" type="text">
          @if (isSubmitting && f['context'].errors?.['required']) {
            <span class="text-danger" style="font-size: 12px;">Context is required</span>
          }
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
