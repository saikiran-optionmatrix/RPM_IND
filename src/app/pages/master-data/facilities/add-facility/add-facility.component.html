<div class="NewHeader">
  <h1 mat-dialog-title>{{ isEditMode ? 'Update Facility' : 'Add Facility' }}</h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12 facility-dialog-body">
    <form [formGroup]="myGroup" (ngSubmit)="upsertFacility()">
      <div class="row facility-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label facility-field-label">
            Facility Name : 
          </label>
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Facility Name"
            formControlName="FacilityName"
            type="text"
          />
        </div>
      </div>

      <div class="row facility-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label facility-field-label">
            Facility Code : 
          </label>
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Facility Code"
            formControlName="FacilityCode"
            type="text"
          />
        </div>
      </div>

     <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
