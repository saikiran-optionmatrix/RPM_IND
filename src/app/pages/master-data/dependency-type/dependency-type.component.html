<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="app-table-container">

        <div class="app-page-actions">
          <!-- <button type="button" class="app-btn app-btn-filter" (click)="toggleFilter()">
            <mat-icon>filter_list</mat-icon>
            <span>Filter</span>
          </button> -->
        </div>

        @if (showFilter) {
        <mat-card class="app-filter-panel">
          <mat-card-content>
            <div class="app-filter-grid">

              <!-- 1. Wrap your fields here -->
              <div class="app-filter-fields">
                <div class="app-filter-field">
                  <label for="depKeyword">Keyword:</label>
                  <mat-form-field appearance="outline" class="app-filter-control">
                    <input matInput id="depKeyword" [(ngModel)]="keyword" placeholder="Search Dependency Type">
                  </mat-form-field>
                </div>
              </div>

              <!-- 2. Actions sit under the fields -->
              <div class="app-filter-actions">
                <button type="button" class="app-btn app-btn-primary" (click)="onSearch()">
                  <mat-icon>search</mat-icon>
                  <span>Search</span>
                </button>
                <button type="button" class="app-btn app-btn-default" (click)="onClear()">
                  <mat-icon>settings_backup_restore</mat-icon>
                  <span>Clear</span>
                </button>
              </div>

              <!-- 3. Wrap your toggle button -->
              <div class="app-filter-toggle">
                <button type="button" class="app-icon-btn" aria-label="Collapse filter" (click)="toggleFilter()">
                  <mat-icon>keyboard_double_arrow_up</mat-icon>
                </button>
              </div>

            </div>
          </mat-card-content>
        </mat-card>
        }

        <div class="table-responsive">
          <table class="table app-table">
            <thead>
              <tr>
                <th class="text-center" style="width: 180px;">Dependency Code</th>
                <th class="text-left" style="width: 250px;">Dependency Name</th>
                <th class="text-left">Description</th>
              </tr>
            </thead>
            <tbody>
              @for (item of paginatedDependencyTypes; track item.code) {
                <tr>
                  <td class="text-center font-weight-bold" >{{ item.code }}</td>
                  <td class="text-left font-weight-500">{{ item.name }}</td>
                  <td class="text-left">{{ item.description }}</td>
                </tr>
              } @empty {
                <tr>
                  <td colspan="3" class="empty-table">No records found</td>
                </tr>
              }
            </tbody>
          </table>
        </div>

        <mat-paginator
          [length]="filteredDependencyTypes.length"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 20, 50]"
          [showFirstLastButtons]="true"
          (page)="handlePage($event)">
        </mat-paginator>

      </div>
    </div>
  </div>
</div>
