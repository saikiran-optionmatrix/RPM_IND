<div class="NewHeader">
  <h1 mat-dialog-title>Update Template</h1>
</div>

<div mat-dialog-content class="edit-template-content">
  <form [formGroup]="templateForm" (ngSubmit)="save()">
    <div class="template-form-row">
      <!-- Left Column (50% width) -->
      <div class="template-column">
        <div class="template-field-row">
          <label for="templateName">Template Name :</label>
          <input
            id="templateName"
            class="form-control"
            formControlName="name"
            placeholder="Enter Template Name"
            type="text"
          />
        </div>

        <div class="template-field-row">
          <label for="templateDescription">Description :</label>
          <textarea
            id="templateDescription"
            class="form-control"
            formControlName="description"
            placeholder="Enter Template Description"
            rows="2"
          ></textarea>
        </div>

        <div class="template-field-row">
          <label for="templateDivision">Division :</label>
          <select id="templateDivision" class="form-control" formControlName="division">
            <option value="">Select Division</option>
            @for (division of divisionsList; track division) {
              <option [value]="division">{{ division }}</option>
            }
          </select>
        </div>
