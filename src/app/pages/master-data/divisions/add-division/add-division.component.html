<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Division' : 'Add Division' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="myGroup" (ngSubmit)="upsertDivision()">

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Division Name :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" maxlength="50" placeholder="Enter Division Name"
            formControlName="divisionName" type="text">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Division Code :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" maxlength="50" placeholder="Enter Division Code"
            formControlName="divisionCode" type="text">
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
