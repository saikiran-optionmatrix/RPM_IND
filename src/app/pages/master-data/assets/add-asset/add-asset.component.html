<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Resource' : 'Add Resource' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="myGroup" (ngSubmit)="upsertAsset()">

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Resource Name :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="50" placeholder="Enter Resource Name"
            formControlName="AssetName" type="text">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Resource Code :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="50" placeholder="Enter Resource Code"
            formControlName="AssetCode" type="text">
        </div>
      </div>

      <!-- <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Resource Category :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="50" placeholder="Enter Category Name"
            formControlName="AssetCategory" type="text">
        </div>
      </div> -->

      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="button" class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
