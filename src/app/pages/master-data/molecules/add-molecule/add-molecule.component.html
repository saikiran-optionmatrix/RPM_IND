<div class="NewHeader">
  <h1 mat-dialog-title>{{ isEditMode ? 'Edit' : 'Add' }} Component / System</h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px">
    <form [formGroup]="myGroup" (ngSubmit)="upsertMolecule()">
      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label molecule-field-label"
            >Component / System Name  :</label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Component / System Name"
            formControlName="MoleculeName"
            type="text"
          />
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px">
        <div class="col-sm-3">
          <label class="add-member-label control-label molecule-field-label"
            >Description :</label
          >
        </div>
        <div class="col-sm-9">
          <textarea
            class="form-control name back"
            rows="3"
            placeholder="Enter Description"
            formControlName="Description"
          ></textarea>
        </div>
      </div>

      <div style="margin-bottom: 10px">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px">
          <button class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
