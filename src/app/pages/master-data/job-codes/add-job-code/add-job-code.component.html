<div class="NewHeader">
  <h1 mat-dialog-title>{{ isEditMode ? 'Update Job Code' : 'Add Job Code' }}</h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12 job-code-dialog-body">
    <form [formGroup]="myGroup" (ngSubmit)="upsertJobCode()">
      <div class="row job-code-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label job-code-field-label">Job Code :</label>
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Job Code"
            formControlName="JobCode"
            type="text"
          />
        </div>
      </div>

      <div class="row job-code-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label job-code-field-label">Narration :</label>
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="100"
            placeholder="Enter Narration"
            formControlName="Narration"
            type="text"
          />
        </div>
      </div>

      <div class="row job-code-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label job-code-field-label">Description :</label>
        </div>
        <div class="col-sm-9">
          <textarea
            class="form-control name back"
            rows="3"
            placeholder="Enter Description"
            formControlName="Description"
          ></textarea>
        </div>
      </div>

      <div class="row job-code-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label job-code-field-label"
            >Hourly Rate ($):</label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            placeholder="Enter Rate (e.g. 50)"
            formControlName="HourlyRate"
            type="number"
            min="0"
          />
        </div>
      </div>

    <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
