<div class="NewHeader">
  <h1 mat-dialog-title>{{ isEditMode ? 'Update Project Status' : 'Add Project Status' }}</h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12 project-status-dialog-body">
    <form [formGroup]="myGroup" (ngSubmit)="upsertProjectStatus()">
      <div class="row project-status-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label project-status-field-label"
            >Project Status :</label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter Project Status"
            formControlName="ProjectStatus"
            type="text"
          />
        </div>
      </div>

      <div class="row project-status-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label project-status-field-label"
            >Description :</label
          >
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="100"
            placeholder="Enter Project Status Description"
            formControlName="Description"
            type="text"
          />
        </div>
      </div>

       <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
