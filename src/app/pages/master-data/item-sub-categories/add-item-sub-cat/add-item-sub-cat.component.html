<div class="NewHeader">
  <h1 mat-dialog-title>{{ isEditMode ? 'Update Category' : 'Add Category' }}</h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12 sub-category-dialog-body">
    <form [formGroup]="myGroup" (ngSubmit)="upsertItemSubCategory()">
      <div class="row sub-category-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label sub-category-field-label">
            Category : 
          </label>
        </div>
        <div class="col-sm-9">
          <select class="form-control name back" formControlName="Category">
            <option value="">Select Category</option>
            @for (category of categories; track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row sub-category-field-row">
        <div class="col-sm-3">
          <label class="add-member-label control-label sub-category-field-label">
            Sub<br />Category : 
          </label>
        </div>
        <div class="col-sm-9">
          <input
            class="form-control name back"
            maxlength="50"
            placeholder="Enter SubCategory Name"
            formControlName="SubCategory"
            type="text"
          />
        </div>
      </div>

       <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button class="app-btn app-btn-primary">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
