<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Criteria' : 'Add Criteria' }}
  </h1>
</div>

<div mat-dialog-content style="padding: 20px 24px; max-height: 85vh; overflow-y: auto; overflow-x: hidden;">
  <form [formGroup]="criteriaForm" (ngSubmit)="save()">
    <div class="row" style="margin-left: 0; margin-right: 0; display: flex; min-width: 850px;">

      <!-- ========================= LEFT COLUMN ========================= -->
      <div class="col-sm-6" style="padding-left: 20px; padding-right: 20px;">

        <!-- Subject -->
        <div class="row" style="margin-bottom: 16px; display: flex; align-items: center;">
          <div class="col-sm-4" style="padding-left: 0;">
            <label class="add-member-label control-label" style="margin: 0; font-weight: 500; font-size: 13px;">
              Subject: 
            </label>
          </div>
          <div class="col-sm-8" style="padding-right: 0;">
            <input class="form-control name back" maxlength="200" placeholder="Enter Subject"
                   formControlName="subject" type="text" style="height: 38px;">
          </div>
        </div>

        <!-- Description -->
        <div class="row" style="margin-bottom: 16px; display: flex; align-items: flex-start;">
          <div class="col-sm-4" style="padding-left: 0;">
            <label class="add-member-label control-label" style="margin: 0; font-weight: 500; font-size: 13px; margin-top: 6px;">
              Description:
            </label>
          </div>
          <div class="col-sm-8" style="padding-right: 0;">
            <textarea class="form-control" rows="3" placeholder="Enter Description"
                      formControlName="description" style="resize: vertical; background-color: white !important;"></textarea>
          </div>
        </div>

        <!-- Priority -->
        <div class="row" style="margin-bottom: 16px; display: flex; align-items: center;">
          <div class="col-sm-4" style="padding-left: 0;">
            <label class="add-member-label control-label" style="margin: 0; font-weight: 500; font-size: 13px;">
              Priority : 
            </label>
          </div>
          <div class="col-sm-8" style="padding-right: 0;">
          <mat-checkbox  color="primary"></mat-checkbox>
          </div>
        </div>

        <!-- Mandatory -->
        <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
          <div class="col-sm-4" style="padding-left: 0;">
            <label class="add-member-label control-label" style="margin: 0; font-weight: 500; font-size: 13px;">
              Mandatory:  
            </label>
          </div>
          <div class="col-sm-8" style="padding-right: 0; display: flex; align-items: center;">
            <mat-checkbox  color="primary"></mat-checkbox>
          </div>
        </div>

      </div>

      <!-- ========================= RIGHT COLUMN ========================= -->
      <div class="col-sm-6" style="padding-left: 20px; padding-right: 0; display: flex; flex-direction: column;">

        <div style="margin-bottom: 10px; text-align: center;">
          <label class="control-label" style="margin: 0; font-weight: 500; font-size: 14px; color: #334155;">
            Upload Guidelines:
          </label>
        </div>

        <!-- Drag & Drop Upload Zone -->
        <div class="guidelines-dropzone"
             [class.dragging]="isDragging"
             (dragover)="$event.preventDefault(); isDragging = true;"
             (dragleave)="isDragging = false;"
             (drop)="onFileDropped($event)"
             style="flex: 1; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fafbfc; min-height: 180px;">
          
          <p style="color: #475569; font-size: 14px; font-weight: 500; margin-bottom: 16px; text-align: center;">
            Drag and drop files here
          </p>
          
          <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;">
          <button type="button" class="app-btn app-btn-primary" (click)="fileInput.click()" style="padding: 8px 24px; font-weight: 600; font-size: 13px;">
            Browse Files
          </button>

          @if (uploadedFileName) {
            <div style="margin-top: 14px; padding: 4px 10px; background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #0369a1; font-weight: 500;">
              <mat-icon style="font-size: 16px; width: 16px; height: 16px; line-height: 16px;">description</mat-icon>
              <span style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ uploadedFileName }}</span>
              <a style="cursor: pointer; color: #ef4444; margin-left: 4px; display: inline-flex; align-items: center;" (click)="removeFile()" matTooltip="Remove File">
                <mat-icon style="font-size: 16px; width: 16px; height: 16px; line-height: 16px;">close</mat-icon>
              </a>
            </div>
          }
        </div>

      </div>

    </div>

    <!-- Dialog Actions Footer -->
    <div style="margin-top: 25px; margin-bottom: 5px;">
      <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="app-btn app-btn-default" (click)="close()">
          <mat-icon>cancel</mat-icon> Close
        </button>
        <button type="submit" class="app-btn app-btn-primary" [disabled]="criteriaForm.invalid">
          <mat-icon>save</mat-icon> Save
        </button>
      </div>
    </div>

  </form>
</div>
