<div class="NewHeader">
  <h1 mat-dialog-title>
    Predecessors
  </h1>
</div>

<div mat-dialog-content style="padding: 16px 24px;">
  <div class="col-sm-12" style="margin-bottom: 10px; padding: 0;">

    <!-- Top: Activity Information & Add Button -->
    <div style="display: flex; justify-content:end; align-items: center; margin-bottom: 14px; margin-top: 4px; flex-wrap: wrap; gap: 10px;">
      <!-- <div>
        @if (taskName) {
          <span style="font-size: 14px; color: #64748b;">
            Activity:
            <strong style="color: #1e293b;">
              @if (taskSlNo) {
                <span style="color: #64748b; font-weight: 500; margin-right: 4px;">[{{ taskSlNo }}]</span>
              }
              {{ taskName }}
            </strong>
          </span>
        }
      </div> -->

      <button type="button" class="app-btn app-btn-primary" (click)="addRow()">
        <mat-icon>add</mat-icon>
        <span>Add</span>
      </button>
    </div>

    <!-- Table with Actions, Stage, Deliverable, Activity -->
    <div class="app-table-container" style="padding: 0 !important; width: 100%;">
      <div class="table-responsive" style="max-height: 520px; overflow-x: auto; overflow-y: auto;">
        <table class="table app-table" style="width: 100%;">
          <thead>
            <tr>
              <th class="text-center" style="width: 70px; min-width: 70px;">Actions</th>
              <th class="text-left" style="width: 20%; min-width: 160px;">
                Stage  
              </th>
              <th class="text-left" style="width: 22%; min-width: 180px;">
                Deliverable
              </th>
              <th class="text-left" style="width: 24%; min-width: 190px;">
                Activity
              </th>
              <th class="text-left" style="width: 34%; min-width: 270px;">
               Dependency Type
              </th>
            </tr>
          </thead>
          <tbody>
            @for (row of paginatedPredecessors; track $index) {
            <tr>

              <!-- Actions (only delete) -->
              <td class="text-center" style="vertical-align: middle;">
                <div class="table-actions" style="justify-content: center;">
                  <button
                    type="button"
                    class="table-action-button delete"
                    matTooltip="Delete Predecessor"
                    aria-label="Delete Predecessor"
                    (click)="deleteRow(row)">
                    <mat-icon>delete</mat-icon>
                  </button>
                </div>
              </td>

              <!-- Stage (dropdown) (mandatory) -->
              <td class="text-left" style="vertical-align: middle;">
                <select
                  class="form-control name back"
                  [(ngModel)]="row.stage"
                  (change)="onStageChange(row)"
                  required
                  style="font-size: 13px; height: 34px; cursor: pointer;">
                  <option value="" disabled selected>Select Stage *</option>
                  @for (stage of stageOptions; track stage) {
                    <option [value]="stage">{{ stage }}</option>
                  }
                </select>
              </td>

              <!-- Deliverable (dropdown) (non-mandatory) -->
              <td class="text-left" style="vertical-align: middle;">
                <select
                  class="form-control white"
                  [(ngModel)]="row.deliverable"
                  (change)="onDeliverableChange(row)"
                  style="font-size: 13px; height: 34px; cursor: pointer;">
                  <option value="" selected>Select Deliverable </option>
                  @for (del of getDeliverablesForStage(row.stage); track del) {
                    <option [value]="del">{{ del }}</option>
                  }
                </select>
              </td>

              <!-- Activity (dropdown) (non-mandatory) -->
              <td class="text-left" style="vertical-align: middle;">
                <select
                  class="form-control white"
                  [(ngModel)]="row.activity"
                  style="font-size: 13px; height: 34px; cursor: pointer;">
                  <option value="" disabled selected>Select Activity</option>
                  @for (act of getActivitiesFor(row.stage, row.deliverable); track act) {
                    <option [value]="act">{{ act }}</option>
                  }
                </select>
              </td>

              <!-- Type (dropdown) -->
              <td class="text-left" style="vertical-align: middle;">
                <select
                  class="form-control white"
                  [(ngModel)]="row.type"
                  style="font-size: 13px; height: 34px; cursor: pointer;">
                  <option value="" disabled selected>Select Type</option>
                  @for (opt of typeOptions; track opt) {
                    <option [value]="opt">{{ opt }}</option>
                  }
                </select>
              </td>

            </tr>
            } @empty {
            <tr>
              <td colspan="5" class="empty-table text-center" style="padding: 24px; color: #64748b;">
                No predecessors assigned yet
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>

      <!-- Paginator matching AssignTasksComponent -->
      <mat-paginator
        [length]="predecessorList.length"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20, 50]"
        [showFirstLastButtons]="true"
        (page)="handlePage($event)">
      </mat-paginator>
    </div>

    <!-- Bottom Actions: Close and Save matching AssignTasksComponent -->
    <div style="margin-top: 20px; margin-bottom: 10px;">
      <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="app-btn app-btn-default" (click)="close()">
          <mat-icon>cancel</mat-icon> Close
        </button>
        <button type="button" class="app-btn app-btn-primary" (click)="save()">
          <mat-icon>save</mat-icon> Save
        </button>
      </div>
    </div>

  </div>
</div>
