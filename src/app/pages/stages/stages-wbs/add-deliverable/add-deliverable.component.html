<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Deliverable' : 'Add Deliverable' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px; padding-top: 15px;">
    <form [formGroup]="deliverableForm" (ngSubmit)="save()">

      <!-- Sequence -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Sequence:</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" placeholder="Enter Sequence" formControlName="stage" type="text" readonly>
        </div>
      </div>

      <!-- Deliverable Name -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Deliverable Name:</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" placeholder="Enter Deliverable Name" formControlName="deliverableName" type="text">
        </div>
      </div>

      <!-- Description -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: flex-start;">
        <div class="col-sm-4">
          <label class="control-label" style="margin-top: 5px;">Description:</label>
        </div>
        <div class="col-sm-8">
          <textarea class="form-control" rows="3" placeholder="Enter Description" formControlName="description" style="resize: vertical; background-color: white !important;"></textarea>
        </div>
      </div>

      <!-- Footer Actions -->
      <div style="margin-top: 20px; margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="deliverableForm.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
