<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ dialogTitle }}
  </h1>
</div>

<div mat-dialog-content style="padding: 16px 24px;">
  <div class="col-sm-12" style="margin-bottom: 10px; padding: 0;">

    <!-- Table referencing Assets Table Classes -->
    <div class="app-table-container">
      <div class="table-responsive" style="max-height: 420px; overflow-y: auto;">
        <table class="table app-table" style="width: 100%;">
          <thead>
            <tr>
              <th class="text-left">Name</th>
              <th class="text-center" style="width: 110px;">Signed</th>
              <th class="text-center" style="width: 160px;">Date signed</th>
            </tr>
          </thead>
          <tbody>
            @for (item of signees; track item.name) {
              <tr>
                <td class="text-left font-weight-500">
                  {{ item.name }}
                </td>
                <td class="text-center" style="vertical-align: middle;">
                  <mat-checkbox [(ngModel)]="item.signed" (change)="toggleSigned(item)" color="primary"></mat-checkbox>
                </td>
                <td class="text-center">
                  {{ item.dateSigned || '—' }}
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="empty-table text-center">No records found</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>

    <!-- Download button below table -->
    <div class="workflow-table-actions" style="margin-top: 14px; margin-bottom: 8px;">
      <button type="button" class="app-btn app-btn-primary" (click)="download()">
        <mat-icon>download</mat-icon>
        <span>Download</span>
      </button>
    </div>

    <!-- Close button at the bottom of the popup referencing AddAssetComponent -->
    <div style="margin-top: 16px; margin-bottom: 5px;">
      <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="app-btn app-btn-default" (click)="close()">
          <mat-icon>cancel</mat-icon> Close
        </button>
      </div>
    </div>

  </div>
</div>
