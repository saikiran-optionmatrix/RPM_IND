<div class="NewHeader">
  <h1 mat-dialog-title>Add Stimulation Module</h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px; margin-top: 10px;">
    <form [formGroup]="simulationForm" (ngSubmit)="save()">
      
      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Module Name:</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" placeholder="Enter module name"
                 formControlName="moduleName" type="text">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Planned Start Date:</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" formControlName="plannedStartDate" type="date">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Planned End Date:</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" formControlName="plannedEndDate" type="date">
        </div>
      </div>

      <div style="margin-bottom: 10px; margin-top: 20px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button class="app-btn app-btn-default" type="button" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button class="app-btn app-btn-primary" type="submit">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
