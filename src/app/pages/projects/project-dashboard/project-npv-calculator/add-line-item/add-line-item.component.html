<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Line Item' : 'Add Line Item' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="itemForm" (ngSubmit)="save()">
      
      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Subject :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" placeholder="Enter Subject Name"
                 formControlName="subject" type="text">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Remarks :</label>
        </div>
        <div class="col-sm-9">
          <textarea class="form-control name back" rows="2" placeholder="Enter remarks / description"
                    formControlName="remarks"></textarea>
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Year 0 (₹) :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" placeholder="0"
                 formControlName="year0" type="number">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Year 1 (₹) :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" placeholder="0"
                 formControlName="year1" type="number">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Year 2 (₹) :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" placeholder="0"
                 formControlName="year2" type="number">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Year 3 (₹) :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" placeholder="0"
                 formControlName="year3" type="number">
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Total (₹) :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" placeholder="Auto-calculated total"
                 formControlName="total" type="number">
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button class="app-btn app-btn-default" type="button" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button class="app-btn app-btn-primary" type="submit">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
