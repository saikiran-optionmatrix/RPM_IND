<div class="NewHeader">
  <h1 mat-dialog-title>
    Audit Types
  </h1>
</div>

<div mat-dialog-content style="padding-top: 10px;">
  <div class="row" style="margin-bottom: 25px;">

    <!-- Left Column: Objective Audits -->
    <div class="col-sm-6">
      <h3 style="font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 16px;">
        Objective Audits
      </h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        @for (audit of objectiveAudits; track audit.name) {
          <div>
            <mat-checkbox [(ngModel)]="audit.selected" color="primary">
              <span style="font-size: 14px; font-weight: 500;">{{ audit.name }}</span>
            </mat-checkbox>
          </div>
        }
      </div>
    </div>

    <!-- Right Column: Subjective Audits -->
    <div class="col-sm-6">
      <h3 style="font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 16px;">
        Subjective Audits
      </h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        @for (audit of subjectiveAudits; track audit.name) {
          <div>
            <mat-checkbox [(ngModel)]="audit.selected" color="primary">
              <span style="font-size: 14px; font-weight: 500;">{{ audit.name }}</span>
            </mat-checkbox>
          </div>
        }
      </div>
    </div>

  </div>

  <!-- Action Buttons -->
  <div style="margin-bottom: 10px;">
    <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
      <button type="button" class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
        <mat-icon>cancel</mat-icon> Close
      </button>
      <button type="button" class="app-btn app-btn-primary" (click)="save()">
        <mat-icon>save</mat-icon> Save
      </button>
    </div>
  </div>
</div>
