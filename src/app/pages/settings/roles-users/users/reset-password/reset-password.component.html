<div class="NewHeader">
  <h1 mat-dialog-title>
    Reset Password
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="passwordForm" (ngSubmit)="save()">

      <!-- New Password -->
      <div class="row" style="margin-bottom: 16px; margin-top: 10px;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">New Password :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" placeholder="Please Enter New Password"
                 formControlName="newPassword" type="password">
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="row" style="margin-bottom: 25px;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Confirm Password :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" placeholder="Please Confirm New Password"
                 formControlName="confirmPassword" type="password">
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="passwordForm.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
