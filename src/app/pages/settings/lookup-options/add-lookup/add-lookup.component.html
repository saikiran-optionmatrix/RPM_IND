<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Lookup' : 'Add Lookup' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px; margin-top: 15px;">
    <form [formGroup]="lookupForm" (ngSubmit)="saveLookup()">

      <!-- Code Master Select Field -->
      <div class="row" style="margin-bottom: 18px; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="font-weight: 600; font-size: 14px; margin: 0;">
            Code Master:  
          </label>
        </div>
        <div class="col-sm-9">
          <select class="form-control name back" formControlName="codeMaster" style="background-color: #fef9c3;">
            @for (opt of codeMasterOptions; track opt) {
              <option [value]="opt">{{ opt }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Lookup Name Input Field -->
      <div class="row" style="margin-bottom: 24px; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="font-weight: 600; font-size: 14px; margin: 0;">
            Lookup Name:  
          </label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back"
                 type="text"
                 maxlength="100"
                 placeholder="Enter Lookup Name"
                 formControlName="lookupName"
                 style="background-color: #fef9c3;">
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="lookupForm.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
