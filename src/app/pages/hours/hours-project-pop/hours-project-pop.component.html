<div class="NewHeader">
  <h1 mat-dialog-title>
    View Projects
  </h1>
</div>

<div mat-dialog-content style="padding: 16px 20px; max-height: 75vh; overflow-y: auto;">
  <div class="app-table-container" style="padding: 0; width: 100%;">
    <div class="table-responsive">
      <table class="table app-table" style="white-space: nowrap; margin-bottom: 0;">
        <thead>
          <tr>
            <th class="text-left" style="width: 80px;">S.No</th>
            <th class="text-left" style="width: 180px;">Project Code</th>
            <th class="text-left">Project Name</th>
          </tr>
        </thead>
        <tbody>
          @for (p of projects; track p.sNo) {
            <tr>
              <td class="text-left" style="color: #2563eb; font-weight: 500;">{{ p.sNo }}</td>
              <td class="text-left font-weight-bold" style="font-weight: 700;">{{ p.projectCode }}</td>
              <td class="text-left">{{ p.projectName }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<mat-dialog-actions align="end" style="padding: 12px 20px; display: flex; justify-content: flex-end; margin-top: 0; background: white;">
  <button type="button" class="app-btn app-btn-default" (click)="close()">
    <mat-icon>cancel</mat-icon> Close
  </button>
</mat-dialog-actions>
